<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拾流 · 页面媒体</title>
  <link rel="stylesheet" href="popup.css">
  <script defer src="popup.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 5v5h-5M4 19v-5h5"/><path d="M5.4 9a7.2 7.2 0 0 1 11.9-3.2L20 9M4 15l2.7 3.2A7.2 7.2 0 0 0 18.6 15"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="m10 9 5 3-5 3z"/></symbol>
    <symbol id="i-audio" viewBox="0 0 24 24"><path d="M3 10v4m4-8v12m5-15v18m5-15v12m4-8v4"/></symbol>
    <symbol id="i-stream" viewBox="0 0 24 24"><path d="m3 8 9-5 9 5-9 5zM3 12l9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.5v11m-4.5-4.3L12 15l4.5-4.8M4.5 15.5V19a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-3.5"/></symbol>
    <symbol id="i-open" viewBox="0 0 24 24"><path d="M13 4h7v7m-10 3L20 4m-10 1H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
    <symbol id="i-page" viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9.5h18"/></symbol>
  </svg>

  <header class="masthead">
    <div class="brand">
      <img class="brand-icon" src="icons/icon48.png" width="40" height="40" alt="">
      <div class="brand-text">
        <h1>拾流</h1>
        <p id="site" class="site">页面影音下载器</p>
      </div>
    </div>
    <button id="refresh" class="refresh" type="button" title="重新扫描当前页面">
      <svg class="icon" aria-hidden="true"><use href="#i-refresh"></use></svg>重新扫描
    </button>
  </header>

  <main>
    <div class="list-heading">
      <h2 id="list-title">页面资源</h2>
      <span id="count" class="count" aria-live="polite">扫描中</span>
    </div>
    <div id="filters" class="filters" role="group" aria-label="按资源类型筛选">
      <button type="button" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" data-filter="video" aria-pressed="false">视频</button>
      <button type="button" data-filter="audio" aria-pressed="false">音频</button>
      <button type="button" data-filter="stream" aria-pressed="false">流媒体</button>
    </div>
    <div id="results" class="results" aria-busy="true">
      <ul id="list" class="media-list" aria-labelledby="list-title" hidden></ul>
      <div id="empty" class="empty">
        <span class="empty-art" aria-hidden="true"><svg class="icon"><use id="empty-icon" href="#i-search"></use></svg></span>
        <h3 id="empty-title">正在扫描页面</h3>
        <p id="empty-text">正在查找当前标签页里的媒体资源。</p>
      </div>
    </div>
    <p id="blob-note" class="note" hidden>页面还使用了临时媒体地址。播放几秒后可重新扫描，查找对应的媒体源。</p>
    <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  </main>

  <template id="row-template">
    <li class="media-row">
      <span class="media-icon" aria-hidden="true"><svg class="icon"><use></use></svg></span>
      <div class="media-body">
        <span class="media-title" dir="auto"></span>
        <div class="metadata"><span class="format"></span><span class="detail"></span></div>
      </div>
      <button class="action" type="button">
        <svg class="icon" aria-hidden="true"><use></use></svg><span></span>
      </button>
      <p class="transfer-status" hidden></p>
    </li>
  </template>
</body>
</html>
